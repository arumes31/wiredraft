name: Minified JavaScript Artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minify-js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  minify:
    name: Build minified module tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Minify JavaScript module tree
        run: npm run minify:js
      - name: Verify minified module syntax
        run: find .quality-data/minified-js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Upload minified JavaScript
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiredraft-minified-js-${{ github.sha }}
          path: .quality-data/minified-js/
          if-no-files-found: error
          retention-days: 14
