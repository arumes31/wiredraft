name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go tests, race, fuzz, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: go run ./cmd/checkcoverage -profile coverage.out -minimum 70
      - name: Fuzz topology JSON
        run: go test ./internal/model -run=^$ -fuzz=FuzzTopologyJSON -fuzztime=20s
      - name: Fuzz request JSON
        run: go test ./internal/handler -run=^$ -fuzz=FuzzDecodeJSON -fuzztime=20s
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: JavaScript unit and CSS contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run coverage contracts
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  browsers:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: wiredraft
      PGUSER: wiredraft
      PGPASSWORD: wiredraft-playwright
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: wiredraft
          POSTGRES_USER: wiredraft
          POSTGRES_PASSWORD: wiredraft-playwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiredraft -d wiredraft"
          --health-interval 5s
          --health-timeout 4s
          --health-start-period 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install browser runtime
        run: npx playwright install --with-deps "$BROWSER"
      - name: Run browser tests
        run: npx playwright test --project="$BROWSER"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  edge:
    name: Browser / Microsoft Edge
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: wiredraft
      PGUSER: wiredraft
      PGPASSWORD: wiredraft-playwright
      PGSSLMODE: disable
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules
        run: go mod download
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Initialize PostgreSQL
        env:
          PGPASSWORD: root
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $psql = Join-Path $env:PGBIN "psql.exe"
          & $psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE ROLE wiredraft LOGIN PASSWORD 'wiredraft-playwright'"
          & $psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE wiredraft OWNER wiredraft"
      - name: Install Playwright media runtime
        run: npx playwright install ffmpeg
      - name: Run Edge tests
        run: npm run test:edge

  mutation:
    name: Mutation smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify boundary mutation is killed
        run: bash scripts/mutation-smoke.sh

  container-smoke:
    name: Container build and health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build local image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: wiredraft:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container health
        run: |
          docker network create wiredraft-ci
          docker run --detach --name wiredraft-ci-postgres --network wiredraft-ci \
            --env POSTGRES_DB=wiredraft \
            --env POSTGRES_USER=wiredraft \
            --env POSTGRES_PASSWORD=wiredraft-ci-postgres \
            --health-cmd "pg_isready -U wiredraft -d wiredraft" \
            --health-interval 2s \
            --health-timeout 2s \
            --health-start-period 5s \
            --health-retries 15 \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          for _ in {1..20}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' wiredraft-ci-postgres)" == "healthy" ]]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' wiredraft-ci-postgres)" = "healthy"
          docker run --detach --name wiredraft-ci --network wiredraft-ci --publish 127.0.0.1:18080:8080 \
            --env PGHOST=wiredraft-ci-postgres \
            --env PGDATABASE=wiredraft \
            --env PGUSER=wiredraft \
            --env PGPASSWORD=wiredraft-ci-postgres \
            --env WIREDRAFT_MEDIA_DIR=/media \
            --volume wiredraft-ci-media:/media \
            --env WIREDRAFT_ADMIN_PASSWORD='WireDraft-Smoke-Only-2026!' wiredraft:ci
          for _ in {1..20}; do
            if docker exec wiredraft-ci /wiredraft -healthcheck; then
              break
            fi
            sleep 1
          done
          docker exec wiredraft-ci /wiredraft -healthcheck
          docker restart wiredraft-ci
          for _ in {1..20}; do
            if docker exec wiredraft-ci /wiredraft -healthcheck; then
              break
            fi
            sleep 1
          done
          docker exec wiredraft-ci /wiredraft -healthcheck
      - name: Verify embedded JavaScript is minified
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18080/js/app.js --output /tmp/app.js
          source_bytes=$(wc -c < web/static/js/app.js)
          served_bytes=$(wc -c < /tmp/app.js)
          if (( served_bytes >= source_bytes )); then
            echo "embedded app.js is not minified: source=${source_bytes}, served=${served_bytes}" >&2
            exit 1
          fi
          manifest_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-redirs 0 http://127.0.0.1:18080/js/manifest.json)
          if [[ "$manifest_status" != "303" && "$manifest_status" != "404" ]]; then
            echo "minification manifest is unexpectedly public: HTTP ${manifest_status}" >&2
            exit 1
          fi
      - name: Remove smoke-test container
        if: always()
        run: |
          docker rm --force --volumes wiredraft-ci wiredraft-ci-postgres 2>/dev/null || true
          docker volume rm wiredraft-ci-media 2>/dev/null || true
          docker network rm wiredraft-ci 2>/dev/null || true
