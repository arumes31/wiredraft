name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests, contracts, fuzz seeds, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      # The executable ratchet starts at the measured repository baseline. The
      # tracked target remains >80%; raise this value as uncovered handlers close.
      - run: go run ./cmd/checkcoverage -profile coverage.out -minimum 60
      - run: go test ./internal/model -run=^$ -fuzz=FuzzTopologyJSON -fuzztime=20s
      - run: go test ./internal/handler -run=^$ -fuzz=FuzzDecodeJSON -fuzztime=20s
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  frontend:
    name: JavaScript unit and CSS contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

  browsers:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/

  edge:
    name: Browser / Microsoft Edge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:edge

  mutation:
    name: Mutation smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/mutation-smoke.sh

  docker-security:
    name: Docker image security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: netdiagram:ci
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: netdiagram:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
