name: Visual Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Compare screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: wiredraft
      PGUSER: wiredraft
      PGPASSWORD: wiredraft-playwright
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: wiredraft
          POSTGRES_USER: wiredraft
          POSTGRES_PASSWORD: wiredraft-playwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiredraft -d wiredraft"
          --health-interval 5s
          --health-timeout 4s
          --health-start-period 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare reference screenshots
        run: npm run test:visual
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
