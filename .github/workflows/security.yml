name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Source, dependency, and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Go dependencies
        run: govulncheck ./...
      - name: Scan Go source
        run: gosec -quiet ./...
      - name: Scan Git history for secrets
        run: gitleaks git --redact --no-banner .
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  filesystem:
    name: Filesystem vulnerability and misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Publish Trivy findings to code scanning.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.74.0
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-filesystem.sarif
          exit-code: 1
      - name: Upload filesystem scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-filesystem
          path: trivy-filesystem.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Publish filesystem findings to code scanning
        if: always() && hashFiles('trivy-filesystem.sarif') != '' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem
      - name: Enforce filesystem scan
        if: always() && steps.trivy.outcome != 'success'
        run: exit 1

  container:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Publish Trivy findings to code scanning.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build scan target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: wiredraft:security-scan
          cache-from: type=gha
      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wiredraft:security-scan
          version: v0.74.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-container.sarif
          exit-code: 1
      - name: Upload container scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-container
          path: trivy-container.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Publish container findings to code scanning
        if: always() && hashFiles('trivy-container.sarif') != '' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container
      - name: Enforce container scan
        if: always() && steps.trivy.outcome != 'success'
        run: exit 1
