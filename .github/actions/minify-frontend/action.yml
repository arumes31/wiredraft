name: Prepare minified frontend
description: Build and check the JavaScript module tree consumed by container images.
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
    - name: Install locked dependencies
      shell: bash
      run: npm ci --ignore-scripts
    - name: Minify JavaScript before image build
      shell: bash
      run: npm run minify:js
    - name: Verify minified module syntax
      shell: bash
      run: find .quality-data/minified-js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
